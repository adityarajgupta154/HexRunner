name: HexRunner CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hexrunner-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hexrunner
          POSTGRES_PASSWORD: hexrunner
          POSTGRES_DB: hexrunner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hexrunner -d hexrunner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://hexrunner:hexrunner@localhost:5432/hexrunner_test
      SESSION_SECRET: github-actions-hexrunner-test-session-secret
      PRIVATE_OBJECT_DIR: /tmp/hexrunner-private-objects

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database schema
        run: pnpm --filter @workspace/db run push

      - name: Typecheck shared libraries
        run: pnpm run typecheck:libs

      - name: Typecheck API
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Typecheck mobile app
        run: pnpm --filter @workspace/hexrunner run typecheck

      - name: Validate API behavior
        run: |
          pnpm --filter @workspace/api-server run validate:air-quality
          pnpm --filter @workspace/api-server run validate:run-saving
          pnpm --filter @workspace/api-server run validate:cold-zones
          pnpm --filter @workspace/api-server run validate:live-presence
          pnpm --filter @workspace/api-server run validate:live-interactions

      - name: Validate mobile behavior
        run: |
          pnpm --filter @workspace/hexrunner run validate:models
          pnpm --filter @workspace/hexrunner run validate:hex-engine
          pnpm --filter @workspace/hexrunner run validate:cold-zones
          pnpm --filter @workspace/hexrunner run validate:live-presence
          pnpm --filter @workspace/hexrunner run validate:live-interactions
          pnpm --filter @workspace/hexrunner run validate:voice-companion
