openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: identity
    description: HexRunner anonymous device identity
  - name: runs
    description: HexRunner run persistence
  - name: territory
    description: HexRunner territory ownership
  - name: safety
    description: Privacy-preserving crowdsourced route safety signals
  - name: airQuality
    description: Sourced local air-quality guidance
  - name: civic
    description: Coarse, moderated community street-issue reports
  - name: users
    description: HexRunner user statistics and rankings
  - name: presence
    description: Ephemeral privacy-preserving live runner presence
  - name: connections
    description: Explicit runner connection and blocking controls
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /anonymous-identities:
    post:
      operationId: registerAnonymousIdentity
      tags: [identity]
      summary: Register an anonymous device identity
      description: Claims an unused locally generated device UID and returns a server-verifiable credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnonymousIdentityRegistration"
      responses:
        "200":
          description: Existing enrollment recovered idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymousIdentityCredential"
        "201":
          description: Anonymous device identity registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymousIdentityCredential"
        "400":
          description: Invalid identity registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Requested UID is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Identity could not be registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /runs:
    post:
      operationId: saveRun
      tags: [runs]
      summary: Save a completed run
      description: Atomically saves a completed run and its claimed H3 array, then reassigns every claimed cell at the server's current time. Current territory totals are derived from live ownership.
      security:
        - anonymousDeviceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveRunRequest"
      responses:
        "200":
          description: Run already existed and was returned without duplication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveRunResult"
        "201":
          description: Run saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveRunResult"
        "400":
          description: Invalid run payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid anonymous device credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Run could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /hex-ownership/lookup:
    post:
      operationId: lookupHexOwnership
      tags: [territory]
      summary: Look up ownership for H3 cells
      description: Returns ownership for at most 1000 supplied resolution-9 H3 indexes. Unclaimed cells are returned with null ownership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HexOwnershipLookupRequest"
      responses:
        "200":
          description: Ownership snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HexOwnershipLookupResult"
        "400":
          description: Invalid or excessive lookup payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Ownership could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /safety-reports:
    post:
      operationId: createSafetyReport
      tags: [safety]
      summary: Report feeling unsafe in the current area
      description: Authenticated report reduced server-side to a coarse resolution-8 H3 area. Raw coordinates are not retained.
      security:
        - anonymousDeviceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSafetyReportRequest"
      responses:
        "200":
          description: Idempotent or duplicate report result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSafetyReportResult"
        "201":
          description: Safety report accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSafetyReportResult"
        "400":
          description: Invalid or stale report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid device credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /safety-areas/lookup:
    post:
      operationId: lookupSafetyAreas
      tags: [safety]
      summary: Look up aggregated coarse-area safety signals
      description: Returns no score until at least three distinct reporters contributed in the retention window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyAreaLookupRequest"
      responses:
        "200":
          description: Privacy-thresholded advisory safety signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyAreaLookupResult"
  /air-quality:
    get:
      operationId: getAirQuality
      tags: [airQuality]
      summary: Get sourced current and forecast air quality
      description: Proxies Open-Meteo air-quality data and returns explicit source, observation time, fetch time, freshness, and non-medical exercise guidance.
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: Sourced AQI reading and guidance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirQualityResult"
        "400":
          description: Invalid coordinates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Source unavailable or returned no usable current AQI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /civic-photo-uploads:
    post:
      operationId: requestCivicPhotoUpload
      tags: [civic]
      summary: Request a short-lived civic photo upload URL
      security:
        - anonymousDeviceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CivicPhotoUploadRequest"
      responses:
        "200":
          description: Short-lived App Storage upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CivicPhotoUploadResult"
        "400":
          description: Invalid photo metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid device credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /civic-reports:
    post:
      operationId: createCivicReport
      tags: [civic]
      summary: Submit a coarse civic issue report
      description: Persists photo-backed issue metadata without exposing reporter identity or exact coordinates publicly.
      security:
        - anonymousDeviceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCivicReportRequest"
      responses:
        "200":
          description: Idempotent civic report result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCivicReportResult"
        "201":
          description: Civic report accepted for moderation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCivicReportResult"
        "400":
          description: Invalid report or missing uploaded photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid device credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /civic-reports/{reportId}/flags:
    post:
      operationId: flagCivicReport
      tags: [civic]
      summary: Flag a duplicate or inappropriate civic report
      security:
        - anonymousDeviceCredential: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 120
            pattern: "^[A-Za-z0-9_-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagCivicReportRequest"
      responses:
        "200":
          description: Flag recorded idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagCivicReportResult"
        "401":
          description: Missing or invalid device credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /civic-map/lookup:
    post:
      operationId: lookupCivicMap
      tags: [civic]
      summary: Look up privacy-safe civic issues and informal caretakers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CivicMapLookupRequest"
      responses:
        "200":
          description: Coarse public civic map layer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CivicMapLookupResult"
  /civic-caretakers:
    post:
      operationId: adoptCivicZone
      tags: [civic]
      summary: Informally adopt a currently owned territory zone
      description: This community label grants no authority, exclusivity, or municipal role and does not change territory ownership.
      security:
        - anonymousDeviceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdoptCivicZoneRequest"
      responses:
        "200":
          description: Existing or newly recorded informal adoption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptCivicZoneResult"
        "401":
          description: Missing or invalid device credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Zone is not currently owned by this runner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [users]
      summary: Get the territory leaderboard
      description: Returns at most 20 runners ordered by totalHexesOwned descending, then total distance, run count, and user ID.
      parameters:
        - name: currentUserId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UserId"
        - name: scope
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LeaderboardScope"
      responses:
        "200":
          description: Territory leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResult"
        "500":
          description: Leaderboard could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /users/{userId}/baseline:
    patch:
      operationId: updateUserBaseline
      tags: [users]
      summary: Save a runner's initial fitness baseline
      security:
        - anonymousDeviceCredential: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserBaselineUpdate"
      responses:
        "200":
          description: Baseline saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBaseline"
        "400":
          description: Invalid baseline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid anonymous device credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Device credential does not match the runner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /users/{userId}/stats:
    get:
      operationId: getUserStats
      tags: [users]
      summary: Get user totals and recent runs
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UserId"
      responses:
        "200":
          description: User totals and up to five recent runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStatsResult"
        "400":
          description: Invalid user ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Stats could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /presence/heartbeat:
    post:
      operationId: heartbeatPresence
      tags: [presence]
      security: [{ anonymousDeviceCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresenceHeartbeatInput" }
      responses:
        "200":
          description: Presence refreshed
          content: { application/json: { schema: { $ref: "#/components/schemas/PresenceHeartbeatResult" } } }
        "400": { description: Invalid presence, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: Another live run is active, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "429": { description: Heartbeat frequency is too high, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /presence/end:
    post:
      operationId: endPresence
      tags: [presence]
      security: [{ anonymousDeviceCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresenceEndInput" }
      responses:
        "204": { description: Presence ended }
        "400": { description: Invalid presence end data, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /presence/nearby:
    get:
      operationId: getNearbyPresence
      tags: [presence]
      security: [{ anonymousDeviceCredential: [] }]
      parameters:
        - name: radiusMeters
          in: query
          required: true
          schema: { type: number, minimum: 25, maximum: 5000 }
        - name: limit
          in: query
          schema: { type: number, multipleOf: 1, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Nearby live runners
          content: { application/json: { schema: { $ref: "#/components/schemas/NearbyPresenceResult" } } }
        "400": { description: Invalid query, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /connections:
    get:
      operationId: listConnections
      tags: [connections]
      security: [{ anonymousDeviceCredential: [] }]
      responses:
        "200": { description: Connections, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Connection" } } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /connections/{userId}/request:
    post:
      operationId: requestConnection
      tags: [connections]
      security: [{ anonymousDeviceCredential: [] }]
      parameters: [{ name: userId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }]
      responses:
        "200": { description: Connection requested, content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } } }
        "400": { description: Invalid action, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /connections/{userId}/accept:
    post:
      operationId: acceptConnection
      tags: [connections]
      security: [{ anonymousDeviceCredential: [] }]
      parameters: [{ name: userId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }]
      responses:
        "200": { description: Connection accepted, content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } } }
        "400": { description: Invalid action, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /connections/{userId}/reject:
    post:
      operationId: rejectConnection
      tags: [connections]
      security: [{ anonymousDeviceCredential: [] }]
      parameters: [{ name: userId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }]
      responses:
        "204": { description: Request rejected }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /connections/{userId}:
    delete:
      operationId: removeConnection
      tags: [connections]
      security: [{ anonymousDeviceCredential: [] }]
      parameters: [{ name: userId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }]
      responses:
        "204": { description: Connection removed }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /connections/{userId}/block:
    post:
      operationId: blockConnection
      tags: [connections]
      security: [{ anonymousDeviceCredential: [] }]
      parameters: [{ name: userId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }]
      responses:
        "200": { description: User blocked, content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } } }
        "400": { description: Invalid action, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
components:
  securitySchemes:
    anonymousDeviceCredential:
      type: http
      scheme: bearer
      bearerFormat: HexRunner anonymous device credential
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnonymousIdentityRegistration:
      type: object
      properties:
        requestedUserId:
          type: string
          minLength: 8
          maxLength: 120
          pattern: "^[A-Za-z0-9_-]+$"
        enrollmentSecret:
          type: string
          minLength: 64
          maxLength: 128
          pattern: "^[0-9a-f]+$"
      required: [requestedUserId, enrollmentSecret]
    AnonymousIdentityCredential:
      type: object
      properties:
        userId:
          type: string
          minLength: 8
          maxLength: 120
          pattern: "^[A-Za-z0-9_-]+$"
        credential:
          type: string
          minLength: 32
          maxLength: 1024
      required: [userId, credential]
    RunPoint:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        timestamp:
          type: number
          multipleOf: 1
          minimum: 0
        accuracyMeters:
          type: number
          minimum: 0
        speedMetersPerSecond:
          type: number
          minimum: 0
        mocked:
          type: boolean
      required: [lat, lng, timestamp]
    UserId:
      type: string
      minLength: 8
      maxLength: 120
      pattern: "^[A-Za-z0-9_-]+$"
    RunAntiSpoofAdvisory:
      type: object
      description: Client-observed telemetry retained for future anti-spoof analysis. These fields are advisory and do not reject a run.
      properties:
        flaggedSuspicious:
          type: boolean
        reason:
          type: string
          maxLength: 200
        mockLocationDetected:
          type: boolean
        averageAccuracyMeters:
          type: number
          minimum: 0
        maxSpeedMetersPerSecond:
          type: number
          minimum: 0
    RunAntiSpoofResult:
      type: object
      properties:
        flaggedSuspicious:
          type: boolean
        reason:
          type: [string, "null"]
        mockLocationDetected:
          type: [boolean, "null"]
        averageAccuracyMeters:
          type: [number, "null"]
        maxSpeedMetersPerSecond:
          type: [number, "null"]
      required: [flaggedSuspicious, reason, mockLocationDetected, averageAccuracyMeters, maxSpeedMetersPerSecond]
    SaveRunRequest:
      type: object
      properties:
        clientRunId:
          type: string
          minLength: 8
          maxLength: 120
          pattern: "^[A-Za-z0-9_-]+$"
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        elapsedSeconds:
          type: number
          multipleOf: 1
          minimum: 0
        distanceKm:
          type: number
          minimum: 0
        points:
          type: array
          maxItems: 20000
          items:
            $ref: "#/components/schemas/RunPoint"
        claimedHexes:
          type: array
          maxItems: 10000
          uniqueItems: true
          items:
            type: string
            minLength: 15
            maxLength: 16
            pattern: "^89[0-9a-f]{13}$"
        antiSpoof:
          $ref: "#/components/schemas/RunAntiSpoofAdvisory"
      required:
        - clientRunId
        - startedAt
        - endedAt
        - elapsedSeconds
        - distanceKm
        - points
        - claimedHexes
    SaveRunResult:
      type: object
      properties:
        runId:
          type: string
        saved:
          type: boolean
        idempotent:
          type: boolean
        newHexes:
          type: number
          multipleOf: 1
          minimum: 0
        stolenHexes:
          type: number
          multipleOf: 1
          minimum: 0
        claimedHexes:
          type: number
          multipleOf: 1
          minimum: 0
        budgetSkippedHexes:
          type: number
          multipleOf: 1
          minimum: 0
        dailyClaimedHexes:
          type: number
          multipleOf: 1
          minimum: 0
        dailyBudget:
          type: number
          multipleOf: 1
          minimum: 1
        currentStreak:
          type: number
          multipleOf: 1
          minimum: 0
        antiSpoof:
          $ref: "#/components/schemas/RunAntiSpoofResult"
      required: [runId, saved, idempotent, newHexes, stolenHexes, claimedHexes, budgetSkippedHexes, dailyClaimedHexes, dailyBudget, currentStreak, antiSpoof]
    HexOwnershipLookupRequest:
      type: object
      properties:
        h3Indexes:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 15
            maxLength: 16
            pattern: "^89[0-9a-f]{13}$"
      required: [h3Indexes]
    HexOwnership:
      type: object
      properties:
        h3Index:
          type: string
        ownerId:
          type: [string, "null"]
        claimedAt:
          type: [string, "null"]
          format: date-time
        freshnessScore:
          type: [number, "null"]
          minimum: 0
          maximum: 100
      required: [h3Index, ownerId, claimedAt, freshnessScore]
    HexOwnershipLookupResult:
      type: object
      properties:
        ownership:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/HexOwnership"
      required: [ownership]
    CreateSafetyReportRequest:
      type: object
      properties:
        clientReportId:
          type: string
          minLength: 8
          maxLength: 120
          pattern: "^[A-Za-z0-9_-]+$"
        clientRunId:
          type: string
          minLength: 8
          maxLength: 120
          pattern: "^[A-Za-z0-9_-]+$"
        areaH3Index:
          type: string
          minLength: 15
          maxLength: 16
