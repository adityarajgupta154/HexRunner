openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: identity
    description: HexRunner anonymous device identity
  - name: runs
    description: HexRunner run persistence
  - name: territory
    description: HexRunner territory ownership
  - name: safety
    description: Privacy-preserving crowdsourced route safety signals
  - name: users
    description: HexRunner user statistics and rankings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /anonymous-identities:
    post:
      operationId: registerAnonymousIdentity
      tags: [identity]
      summary: Register an anonymous device identity
      description: Claims an unused locally generated device UID and returns a server-verifiable credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnonymousIdentityRegistration"
      responses:
        "200":
          description: Existing enrollment recovered idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymousIdentityCredential"
        "201":
          description: Anonymous device identity registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymousIdentityCredential"
        "400":
          description: Invalid identity registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Requested UID is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Identity could not be registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /runs:
    post:
      operationId: saveRun
      tags: [runs]
      summary: Save a completed run
      description: Atomically saves a completed run and its claimed H3 array, then reassigns every claimed cell at the server's current time. Current territory totals are derived from live ownership.
      security:
        - anonymousDeviceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveRunRequest"
      responses:
        "200":
          description: Run already existed and was returned without duplication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveRunResult"
        "201":
          description: Run saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveRunResult"
        "400":
          description: Invalid run payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid anonymous device credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Run could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /hex-ownership/lookup:
    post:
      operationId: lookupHexOwnership
      tags: [territory]
      summary: Look up ownership for H3 cells
      description: Returns ownership for at most 1000 supplied resolution-9 H3 indexes. Unclaimed cells are returned with null ownership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HexOwnershipLookupRequest"
      responses:
        "200":
          description: Ownership snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HexOwnershipLookupResult"
        "400":
          description: Invalid or excessive lookup payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Ownership could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /safety-reports:
    post:
      operationId: createSafetyReport
      tags: [safety]
      summary: Report feeling unsafe in the current area
      description: Authenticated report reduced server-side to a coarse resolution-8 H3 area. Raw coordinates are not retained.
      security:
        - anonymousDeviceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSafetyReportRequest"
      responses:
        "200":
          description: Idempotent or duplicate report result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSafetyReportResult"
        "201":
          description: Safety report accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSafetyReportResult"
        "400":
          description: Invalid or stale report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid device credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /safety-areas/lookup:
    post:
      operationId: lookupSafetyAreas
      tags: [safety]
      summary: Look up aggregated coarse-area safety signals
      description: Returns no score until at least three distinct reporters contributed in the retention window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyAreaLookupRequest"
      responses:
        "200":
          description: Privacy-thresholded advisory safety signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyAreaLookupResult"
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [users]
      summary: Get the territory leaderboard
      description: Returns at most 20 runners ordered by totalHexesOwned descending, then total distance, run count, and user ID.
      parameters:
        - name: currentUserId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UserId"
        - name: scope
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LeaderboardScope"
      responses:
        "200":
          description: Territory leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResult"
        "500":
          description: Leaderboard could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /users/{userId}/baseline:
    patch:
      operationId: updateUserBaseline
      tags: [users]
      summary: Save a runner's initial fitness baseline
      security:
        - anonymousDeviceCredential: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserBaselineUpdate"
      responses:
        "200":
          description: Baseline saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBaseline"
        "400":
          description: Invalid baseline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid anonymous device credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Device credential does not match the runner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /users/{userId}/stats:
    get:
      operationId: getUserStats
      tags: [users]
      summary: Get user totals and recent runs
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UserId"
      responses:
        "200":
          description: User totals and up to five recent runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStatsResult"
        "400":
          description: Invalid user ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Stats could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    anonymousDeviceCredential:
      type: http
      scheme: bearer
      bearerFormat: HexRunner anonymous device credential
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnonymousIdentityRegistration:
      type: object
      properties:
        requestedUserId:
          type: string
          minLength: 8
          maxLength: 120
          pattern: "^[A-Za-z0-9_-]+$"
        enrollmentSecret:
          type: string
          minLength: 64
          maxLength: 128
          pattern: "^[0-9a-f]+$"
      required: [requestedUserId, enrollmentSecret]
    AnonymousIdentityCredential:
      type: object
      properties:
        userId:
          type: string
          minLength: 8
          maxLength: 120
          pattern: "^[A-Za-z0-9_-]+$"
        credential:
          type: string
          minLength: 32
          maxLength: 1024
      required: [userId, credential]
    RunPoint:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        timestamp:
          type: number
          multipleOf: 1
          minimum: 0
        accuracyMeters:
          type: number
          minimum: 0
        speedMetersPerSecond:
          type: number
          minimum: 0
        mocked:
          type: boolean
      required: [lat, lng, timestamp]
    UserId:
      type: string
      minLength: 8
      maxLength: 120
      pattern: "^[A-Za-z0-9_-]+$"
    RunAntiSpoofAdvisory:
      type: object
      description: Client-observed telemetry retained for future anti-spoof analysis. These fields are advisory and do not reject a run.
      properties:
        flaggedSuspicious:
          type: boolean
        reason:
          type: string
          maxLength: 200
        mockLocationDetected:
          type: boolean
        averageAccuracyMeters:
          type: number
          minimum: 0
        maxSpeedMetersPerSecond:
          type: number
          minimum: 0
    RunAntiSpoofResult:
      type: object
      properties:
        flaggedSuspicious:
          type: boolean
        reason:
          type: [string, "null"]
        mockLocationDetected:
          type: [boolean, "null"]
        averageAccuracyMeters:
          type: [number, "null"]
        maxSpeedMetersPerSecond:
          type: [number, "null"]
      required: [flaggedSuspicious, reason, mockLocationDetected, averageAccuracyMeters, maxSpeedMetersPerSecond]
    SaveRunRequest:
      type: object
      properties:
        clientRunId:
          type: string
          minLength: 8
          maxLength: 120
          pattern: "^[A-Za-z0-9_-]+$"
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        elapsedSeconds:
          type: number
          multipleOf: 1
          minimum: 0
        distanceKm:
          type: number
          minimum: 0
        points:
          type: array
          maxItems: 20000
          items:
            $ref: "#/components/schemas/RunPoint"
        claimedHexes:
          type: array
          maxItems: 10000
          uniqueItems: true
          items:
            type: string
            minLength: 15
            maxLength: 16
            pattern: "^89[0-9a-f]{13}$"
        antiSpoof:
          $ref: "#/components/schemas/RunAntiSpoofAdvisory"
      required:
        - clientRunId
        - startedAt
        - endedAt
        - elapsedSeconds
        - distanceKm
        - points
        - claimedHexes
    SaveRunResult:
      type: object
      properties:
        runId:
          type: string
        saved:
          type: boolean
        idempotent:
          type: boolean
        newHexes:
          type: number
          multipleOf: 1
          minimum: 0
        stolenHexes:
          type: number
          multipleOf: 1
          minimum: 0
        claimedHexes:
          type: number
          multipleOf: 1
          minimum: 0
        budgetSkippedHexes:
          type: number
          multipleOf: 1
          minimum: 0
        dailyClaimedHexes:
          type: number
          multipleOf: 1
          minimum: 0
        dailyBudget:
          type: number
          multipleOf: 1
          minimum: 1
        currentStreak:
          type: number
          multipleOf: 1
          minimum: 0
        antiSpoof:
          $ref: "#/components/schemas/RunAntiSpoofResult"
      required: [runId, saved, idempotent, newHexes, stolenHexes, claimedHexes, budgetSkippedHexes, dailyClaimedHexes, dailyBudget, currentStreak, antiSpoof]
    HexOwnershipLookupRequest:
      type: object
      properties:
        h3Indexes:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 15
            maxLength: 16
            pattern: "^89[0-9a-f]{13}$"
      required: [h3Indexes]
    HexOwnership:
      type: object
      properties:
        h3Index:
          type: string
        ownerId:
          type: [string, "null"]
        claimedAt:
          type: [string, "null"]
          format: date-time
        freshnessScore:
          type: [number, "null"]
          minimum: 0
          maximum: 100
      required: [h3Index, ownerId, claimedAt, freshnessScore]
    HexOwnershipLookupResult:
      type: object
      properties:
        ownership:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/HexOwnership"
      required: [ownership]
    CreateSafetyReportRequest:
      type: object
      properties:
        clientReportId:
          type: string
          minLength: 8
          maxLength: 120
          pattern: "^[A-Za-z0-9_-]+$"
        clientRunId:
          type: string
          minLength: 8
          maxLength: 120
          pattern: "^[A-Za-z0-9_-]+$"
        areaH3Index:
          type: string
          minLength: 15
          maxLength: 16
          pattern: "^88[0-9a-f]{13}$"
        occurredAt:
          type: string
          format: date-time
      required: [clientReportId, clientRunId, areaH3Index, occurredAt]
    CreateSafetyReportResult:
      type: object
      properties:
        accepted:
          type: boolean
        duplicate:
          type: boolean
        areaH3Index:
          type: string
        advisory:
          type: string
      required: [accepted, duplicate, areaH3Index, advisory]
    SafetyAreaLookupRequest:
      type: object
      properties:
        areaH3Indexes:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            minLength: 15
            maxLength: 16
            pattern: "^88[0-9a-f]{13}$"
      required: [areaH3Indexes]
    SafetyAreaSignal:
      type: object
      properties:
        areaH3Index:
          type: string
        confidence:
          type: string
          enum: [insufficient, emerging, established]
        concernScore:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        sampleSize:
          type: [number, "null"]
          minimum: 3
      required: [areaH3Index, confidence, concernScore, sampleSize]
    SafetyAreaLookupResult:
      type: object
      properties:
        areas:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/SafetyAreaSignal"
        advisory:
          type: string
      required: [areas, advisory]
    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: number
          multipleOf: 1
          minimum: 1
        displayName:
          type: string
        totalHexesOwned:
          type: number
          multipleOf: 1
          minimum: 0
        totalRuns:
          type: number
          multipleOf: 1
          minimum: 0
        totalDistanceKm:
          type: number
          minimum: 0
        isCurrentUser:
          type: boolean
      required: [rank, displayName, totalHexesOwned, totalRuns, totalDistanceKm, isCurrentUser]
    LeaderboardResult:
      type: object
      properties:
        scope:
          $ref: "#/components/schemas/LeaderboardScope"
        users:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
      required: [scope, users]
    RecentRun:
      type: object
      properties:
        runId:
          type: string
        distanceKm:
          type: number
        averagePaceMinPerKm:
          type: [number, "null"]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        claimedHexes:
          type: number
          multipleOf: 1
          minimum: 0
        newHexes:
          type: number
          multipleOf: 1
          minimum: 0
        stolenHexes:
          type: number
          multipleOf: 1
          minimum: 0
      required: [runId, distanceKm, averagePaceMinPerKm, startedAt, endedAt, claimedHexes, newHexes, stolenHexes]
    UserStatsTotals:
      type: object
      properties:
        totalRuns:
          type: number
          multipleOf: 1
          minimum: 0
        totalDistanceKm:
          type: number
          minimum: 0
        totalElapsedSeconds:
          type: number
          multipleOf: 1
          minimum: 0
        averagePaceMinPerKm:
          type: [number, "null"]
        totalHexesOwned:
          type: number
          multipleOf: 1
          minimum: 0
        totalClaimedHexes:
          type: number
          multipleOf: 1
          minimum: 0
        totalNewHexes:
          type: number
          multipleOf: 1
          minimum: 0
        totalStolenHexes:
          type: number
          multipleOf: 1
          minimum: 0
        currentStreak:
          type: number
          multipleOf: 1
          minimum: 0
        todayClaimedHexes:
          type: number
          multipleOf: 1
          minimum: 0
        dailyBudget:
          type: number
          multipleOf: 1
          minimum: 1
      required: [totalRuns, totalDistanceKm, totalElapsedSeconds, averagePaceMinPerKm, totalHexesOwned, totalClaimedHexes, totalNewHexes, totalStolenHexes, currentStreak, todayClaimedHexes, dailyBudget]
    FitnessTier:
      type: string
      enum: [beginner, casual, regular, trained]
    LeaderboardScope:
      type: string
      enum: [global, city, friends]
    UserBaselineUpdate:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
        city:
          type: string
          minLength: 1
          maxLength: 60
        activityLevel:
          $ref: "#/components/schemas/FitnessTier"
      required: [city, activityLevel]
    UserBaseline:
      type: object
      properties:
        displayName:
          type: string
        city:
          type: string
        activityLevel:
          $ref: "#/components/schemas/FitnessTier"
        completedAt:
          type: string
          format: date-time
      required: [displayName, city, activityLevel, completedAt]
    TakeoverAlert:
      type: object
      properties:
        h3Index:
          type: string
        happenedAt:
          type: string
          format: date-time
      required: [h3Index, happenedAt]
    UserStatsResult:
      type: object
      properties:
        userId:
          type: string
        displayName:
          type: string
        baseline:
          oneOf:
            - $ref: "#/components/schemas/UserBaseline"
            - type: "null"
        totals:
          $ref: "#/components/schemas/UserStatsTotals"
        recentRuns:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/RecentRun"
        takeoverAlerts:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/TakeoverAlert"
      required: [userId, displayName, baseline, totals, recentRuns, takeoverAlerts]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

